services:
  - type: web
    name: line-qwen-webhook
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Note: Local Qwen2.5-0.5B-Instruct requires at least ~2 GB RAM (Standard plan or higher on Render)
    plan: standard
    envVars:
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        value: ""
      - key: QWEN_BACKEND
        value: llamacpp
      - key: QWEN_GGUF_REPO
        value: Qwen/Qwen2.5-0.5B-Instruct-GGUF
      - key: QWEN_GGUF_FILENAME
        value: qwen2.5-0.5b-instruct-q4_0.gguf
      - key: QWEN_N_CTX
        value: "1024"
      - key: LOG_LEVEL
        value: INFO
